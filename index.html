<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Minesweeper</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span>Minen: </span>
                <span id="mine-count">10</span>
            </div>
            <div class="info-item">
                <span>Zeit: </span>
                <span id="timer">0</span>
            </div>
        </div>

        <div class="controls">
            <button id="reset-btn">Neues Spiel</button>
            <select id="difficulty">
                <option value="easy">Einfach (9x9, 10 Minen)</option>
                <option value="medium">Mittel (16x16, 40 Minen)</option>
                <option value="hard">Schwer (16x30, 99 Minen)</option>
            </select>
        </div>

        <div id="game-board"></div>

        <div id="game-status"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
