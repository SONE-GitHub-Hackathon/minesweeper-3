<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung - Minesweeper</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <h1>Minesweeper Registrierung</h1>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Benutzername:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="20">
                <small>3-20 Zeichen</small>
            </div>
            <div class="form-group">
                <label for="password">Passwort:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <small>Mindestens 6 Zeichen</small>
            </div>
            <div class="form-group">
                <label for="password-confirm">Passwort bestätigen:</label>
                <input type="password" id="password-confirm" name="password-confirm" required>
            </div>
            <button type="submit">Registrieren</button>
            <div id="register-error" class="error-message"></div>
        </form>
        <p>Bereits registriert? <a href="/login.html">Anmelden</a></p>
        <p><a href="/">Als Gast spielen</a></p>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>
